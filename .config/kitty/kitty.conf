# Trying kitty as Ghostty's replacement. This matches config.ghostty's look, and sends the same key sequences as Ghostty
# does for every key my zsh, Vim and Claude Code configs rely on (see the README's shortcut table). kitty already sends
# Ghostty's sequences for Cmd+e, Cmd+x, Cmd+[/], Cmd+Shift+↑/↓ and Cmd+Shift+←/→, so only the keys where it differs are
# mapped below.

include themes/catppuccin-mocha.conf

# kitty only accepts a font marked monospace here, which the Mono variant is but plain JetBrainsMono Nerd Font isn't
# (its icons are wider than one cell). Take the icons (in Unicode's private use areas) from the plain one instead, so
# kitty draws them across two cells when a space follows. Note Ghostty doesn't need to configure this, as it accepts 
# plain JetBrainsMono Nerd Font.
font_family JetBrainsMono Nerd Font Mono
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD JetBrainsMono Nerd Font
font_size 16

# Line cursor by default, as in Ghostty. The shell integration shows a line at the prompt anyway, but resets to this
# default before each command, so without it programs that don't set a shape (e.g. Claude Code) get a block.
cursor_shape beam

macos_option_as_alt yes
macos_titlebar_color background
mouse_hide_wait -1
window_padding_width 12
tab_bar_edge top
scrollback_lines 10000

# Split windows like Ghostty's: Cmd+d / Cmd+Shift+d to split right / down, Cmd+Alt+arrows to move between them
enabled_layouts splits

# Ghostty's defaults that my configs rely on
map cmd+left send_text all \x01
map cmd+right send_text all \x05
map cmd+backspace send_text all \x15
map alt+left send_text all \x1bb
map alt+right send_text all \x1bf

# My custom keys (see config.ghostty). Cmd+↑/↓ scroll by default here, and no_op passes them on as `\e[1;9A`/`B`.
map cmd+up no_op
map cmd+down no_op
map cmd+enter send_text all \x1b[13;9u
map cmd+shift+c send_text all \x1b[99;9u
map cmd+z send_text all \x1f
map cmd+shift+z send_text all \x1b/

# Ctrl+↑/↓: jump to the previous/next shell prompt, or pass the keys on to a full-screen program (e.g. for Claude Code
# to jump between my prompts)
map ctrl+up kitten prompt_jump.py up
map ctrl+down kitten prompt_jump.py down

# Tabs and windows as in Ghostty (new ones open in the current directory, Cmd+9 goes to the last tab)
map cmd+t new_tab_with_cwd
map cmd+n new_os_window_with_cwd
map cmd+w close_window
map cmd+d launch --location=vsplit --cwd=current
map cmd+shift+d launch --location=hsplit --cwd=current
map cmd+alt+left neighboring_window left
map cmd+alt+right neighboring_window right
map cmd+alt+up neighboring_window top
map cmd+alt+down neighboring_window bottom
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 99
